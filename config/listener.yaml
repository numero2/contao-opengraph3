services:
    _defaults:
        autoconfigure: true
        public: true


    numero2_opengraph3.listener.data_container.opengraph_fields:
        class: numero2\Opengraph3Bundle\EventListener\DataContainer\OpenGraphFieldsListener
        arguments:
            - '@contao.intl.countries'
            - '@contao.image.sizes'
            - '@security.helper'


    numero2_opengraph3.listener.hook.open_graph:
        class: numero2\Opengraph3Bundle\EventListener\Hook\OpenGraphListener
        arguments:
            - '@request_stack'
            - '@contao.routing.scope_matcher'
            - '@numero2_opengraph3.open_graph.manager'
            - !tagged_iterator numero2_opengraph3.provider


    numero2_opengraph3.listener.kernel_response.backend_assets:
        class: numero2\Opengraph3Bundle\EventListener\KernelResponse\BackendAssetsListener
        arguments:
            - '@contao.routing.scope_matcher'
        tags:
            - kernel.event_subscriber
